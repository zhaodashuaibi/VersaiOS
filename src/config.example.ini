# VersaiOS 配置示例
# 复制此文件为 config.ini 并填入真实值，config.ini 已被 .gitignore 忽略，不会提交

[versaios]
#
# LLM 选择（只改这里即可切换不同厂商）
#
# 支持：
# - gemini：Google Gemini（google-genai）
# - openai_compatible：OpenAI 兼容接口（OpenAI/DeepSeek/通义千问兼容等，取决于 llm_base_url）
#
llm_provider = gemini
llm_api_key = 你的_API_Key
llm_model = gemini-3-flash-preview
# openai_compatible 才需要：
# llm_base_url = https://api.openai.com/v1
com_port = COM3
window_title = VersaiOS_Screen
# 运行 calibrate_mouse.py 测出屏幕边缘极限步数后填入（iPhone 16 参考：140, 310）
hid_max_x = 140
hid_max_y = 310
