# VersaiOS 配置示例
# 复制此文件为 config.ini 并填入真实值，config.ini 已被 .gitignore 忽略，不会提交

[versaios]
#
# LLM 选择（只改这里即可切换不同厂商）
#
# 支持（与 GUI 选择器展示顺序一致）：
# - openai：OpenAI（默认 https://api.openai.com/v1）
# - openai_compatible：兼容 OpenAI 接口（本地模型、中转代理；必须填写 llm_base_url）
# - deepseek：DeepSeek（默认 https://api.deepseek.com）
# - gemini：Google Gemini（google-genai）
# - anthropic：Anthropic Claude（需要安装 anthropic SDK；通常无需 llm_base_url）
# - zhipu：智谱 AI（默认 https://open.bigmodel.cn/api/paas/v4）
# - qwen：阿里通义千问（默认 https://dashscope.aliyuncs.com/compatible-mode/v1）
# - minimax：MiniMax（默认 https://api.minimax.io/v1）
# 请为截图定位选择支持视觉输入的模型；端点可按区域、账户或代理要求覆盖。
#
llm_provider = gemini
llm_api_key = 你的_API_Key
llm_model = gemini-3-flash-preview
# openai_compatible 必须填写；其他提供方可留空并使用代码内置官方端点：
# llm_base_url = http://127.0.0.1:1234/v1
com_port = COM3
window_title = VersaiOS_Screen
# 在 gui_app.py 的“阶段一：准备”中完成 HID 步数校准后填入（iPhone 16 参考：140, 310）
hid_max_x = 140
hid_max_y = 310
