# VersaiOS 配置示例
# 复制此文件为 config.ini 并填入真实值，config.ini 已被 .gitignore 忽略，不会提交

[versaios]
#
# LLM 接口固定为 OpenAI 兼容接口（OpenAI/DeepSeek/本地模型/中转代理等，
# 具体端点由 llm_base_url 决定），无需选择厂商。
#
llm_provider = openai_compatible
llm_api_key = 你的_API_Key
llm_model = gpt-4.1-mini
# OpenAI 兼容端点（必填）：
# llm_base_url = http://127.0.0.1:1234/v1
com_port = COM3
window_title = VersaiOS_Screen
# 在 gui_app.py 的“阶段一：准备”中完成 HID 步数校准后填入（iPhone 16 参考：140, 310）
hid_max_x = 140
hid_max_y = 310
